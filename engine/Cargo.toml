[package]
name = "catecash-browser-engine"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
zcash_address = "=0.14.0"
zcash_protocol = "=0.11.0"
zcash_primitives = { version = "=0.31.0", default-features = false, features = ["std", "circuits", "transparent-inputs"] }
zcash_transparent = { version = "=0.11.0", features = ["transparent-inputs"] }
secp256k1 = "0.33"
bs58 = { version = "0.5", features = ["check"] }
hex = "0.4"
rand = "0.10"
rand_chacha = "0.10"
sapling-crypto = "0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jubjub = "0.11"
orchard = { version = "=0.16.0", default-features = false, features = ["circuit", "std", "zeroize"] }
incrementalmerkletree = "=0.9.0"
zip32 = "=0.3.0"
zcash_note_encryption = "=0.5.1"

[patch.crates-io]
zcash_address = { path = "../../catecash-zebra/vendor/zcash_address" }
zcash_protocol = { path = "../../catecash-zebra/vendor/zcash_protocol" }
zcash_primitives = { path = "../../catecash-zebra/vendor/zcash_primitives" }
zcash_transparent = { path = "../../catecash-zebra/vendor/zcash_transparent" }
